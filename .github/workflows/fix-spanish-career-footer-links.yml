name: Fix Spanish career footer links

on:
  push:
    branches:
      - agent/fix-spanish-career-footer-links

permissions:
  contents: write

jobs:
  repair-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and verify footer links
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('guides/career/technology-careers')
          es_dir = root / 'es-419'
          pt_dir = root / 'pt-BR'

          english = [
              'ai-engineer.md','machine-learning-engineer.md','generative-ai-engineer.md','ai-agent-developer.md','ai-solutions-architect.md','ai-security-engineer.md','ai-governance-specialist.md','responsible-ai-specialist.md','ai-risk-compliance-analyst.md','ai-product-manager.md','ai-adoption-consultant.md','computer-vision-engineer.md','nlp-engineer.md','cybersecurity-analyst.md','cloud-security-engineer.md','security-architect.md','iam-engineer.md','application-security-engineer.md','devsecops-engineer.md','detection-engineer.md','dfir-specialist.md','ot-ics-security-specialist.md','grc-analyst.md','privacy-engineer.md','post-quantum-cryptography-specialist.md','software-supply-chain-security-engineer.md','virtual-ciso.md','data-engineer.md','data-scientist.md','analytics-engineer.md','data-governance-specialist.md','cloud-architect.md','platform-engineer.md','site-reliability-engineer.md','mlops-engineer.md','finops-specialist.md','api-integration-engineer.md','full-stack-software-engineer.md','robotics-engineer.md','autonomous-systems-engineer.md','iot-engineer.md','edge-computing-engineer.md','digital-twin-engineer.md','data-center-infrastructure-technician.md','quantum-software-engineer.md','clean-energy-smart-grid-specialist.md','accessibility-engineer.md','assistive-technology-specialist.md','rehabilitation-technology-consultant.md','inclusive-ux-researcher.md'
          ]
          portuguese = english.copy()

          catalog = (es_dir / 'README.md').read_text(encoding='utf-8')
          entries = re.findall(r'^\s*(\d+)\.\s+\[[^\]]+\]\(([^)]+\.md)\)\s*$', catalog, re.M)
          if len(entries) != 50:
              raise SystemExit(f'Expected 50 Spanish catalog entries, found {len(entries)}')

          changed = 0
          for number_text, spanish_name in entries:
              number = int(number_text)
              path = es_dir / spanish_name
              if not path.is_file():
                  raise SystemExit(f'Missing Spanish guide: {path}')

              en_name = english[number - 1]
              pt_name = portuguese[number - 1]
              if not (root / en_name).is_file():
                  raise SystemExit(f'Missing English target for guide {number}: {root / en_name}')
              if not (pt_dir / pt_name).is_file():
                  raise SystemExit(f'Missing Portuguese target for guide {number}: {pt_dir / pt_name}')

              text = path.read_text(encoding='utf-8')
              replacement = (
                  f'[Volver al catálogo de carreras en español](README.md) | '
                  f'[Edición en inglés](../{en_name}) | '
                  f'[Edición en portugués](../pt-BR/{pt_name})'
              )
              pattern = re.compile(
                  r'^\[(?:Volver al catálogo de carreras en español|Volver al catálogo[^\]]*|Volver a las 50 carreras)\]'
                  r'\([^\n]+\)\s*\|\s*\[(?:English edition|Edición en inglés)[^\]]*\]'
                  r'\([^\n]+\)\s*\|\s*\[(?:Edição em português|Edición en portugués)[^\]]*\]'
                  r'\([^\n]+\)\s*$', re.M)
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not identify exactly one footer in {path}; found {count}')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          if changed != 50:
              raise SystemExit(f'Expected to update 50 guides, updated {changed}')

          for number_text, spanish_name in entries:
              number = int(number_text)
              text = (es_dir / spanish_name).read_text(encoding='utf-8')
              expected = (
                  f'[Volver al catálogo de carreras en español](README.md) | '
                  f'[Edición en inglés](../{english[number - 1]}) | '
                  f'[Edición en portugués](../pt-BR/{portuguese[number - 1]})'
              )
              if expected not in text:
                  raise SystemExit(f'Footer validation failed for guide {number}: {spanish_name}')

      - name: Remove temporary workflow and commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-spanish-career-footer-links.yml
          git add guides/career/technology-careers/es-419
          git commit -m "Fix Spanish career guide language links"
          git push
