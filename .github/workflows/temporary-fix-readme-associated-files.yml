name: Temporary README associated-file repair
on:
  push:
    branches: [agent/fix-readme-associated-files]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-readme-associated-files
          fetch-depth: 0
      - name: Repair confirmed README defects
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          sections = {
            'guides/career/README.md': ('Career Guides', [
              ('Technology Careers', 'technology-careers/'),
              ('Cybersecurity Interview', 'cybersecurity-interview/'),
              ('Cybersecurity Portfolio', 'cybersecurity-portfolio/'),
              ('GRC Analyst', 'grc-analyst/'),
              ('SOC Analyst', 'soc-analyst/'),
              ('Global Technology Opportunities', 'global-technology-opportunities/'),
            ]),
            'guides/architecture-engineering/README.md': ('Architecture and Engineering Guides', [
              ('AI Agents, RAG, and MCP', 'ai-agents-rag-mcp/'),
              ('Azure AI Security', 'azure-ai-security/'),
              ('Identity and Access Management', 'identity-access-management/'),
              ('OT, ICS, and SCADA Security', 'ot-ics-scada/'),
              ('Zero Trust', 'zero-trust/'),
            ]),
            'guides/governance-risk-compliance/README.md': ('Governance, Risk, and Compliance Guides', [
              ('Cybersecurity Risk Assessment', 'cybersecurity-risk-assessment/'),
              ('ISO/IEC 27001', 'iso-27001/'),
              ('Privacy and Data Protection', 'privacy-data-protection/'),
              ('SOC 2 Audit Readiness', 'soc-2-audit-readiness/'),
              ('Third-Party Risk', 'third-party-risk/'),
            ]),
            'guides/security-operations/README.md': ('Security Operations Guides', [
              ('Incident Response', 'incident-response/'),
              ('Metrics and Executive Reporting', 'metrics-executive-reporting/'),
              ('Security Operations Center', 'security-operations-center/'),
            ]),
            'guides/resilience/README.md': ('Resilience Guides', [
              ('Business Continuity and Disaster Recovery', 'business-continuity-disaster-recovery/'),
            ]),
          }

          for path, (title, entries) in sections.items():
            p = Path(path)
            if not p.exists():
              lines = [f'# {title}', '', 'Use this section index to open the available practical guides.', '']
              for label, target in entries:
                if (p.parent / target).exists():
                  lines.append(f'- [{label}]({target})')
              lines += ['', '[Back to repository home](../../README.md)', '']
              p.write_text('\n'.join(lines), encoding='utf-8')

          def actual_files(package, language_names, keywords=()):
            package = Path(package)
            candidates = []
            for lang in language_names:
              d = package / lang
              if d.exists():
                candidates.extend(p for p in d.iterdir() if p.is_file() and p.suffix.lower() in {'.md','.pdf','.docx'})
            if keywords:
              preferred = [p for p in candidates if all(k.lower() in p.name.lower() for k in keywords)]
              if preferred:
                candidates = preferred
            return sorted(candidates, key=lambda p: (p.suffix.lower(), p.name.lower()))

          def replace_language_links(readme_path, language_names, files, label):
            rp = Path(readme_path)
            text = rp.read_text(encoding='utf-8')
            lang_pattern = '|'.join(re.escape(x) for x in language_names)
            text = re.sub(rf'(?m)^.*\]\(\./(?:{lang_pattern})/[^)]+\)\s*$', '', text)
            insertion = []
            for f in files:
              rel = f.relative_to(rp.parent).as_posix()
              ext = f.suffix.upper().lstrip('.')
              insertion.append(f'- [{label} — {ext}](./{rel})')
            marker = '##'
            pos = text.find(marker)
            block = '\n'.join(insertion) + '\n\n'
            if insertion:
              if pos >= 0:
                text = text[:pos] + block + text[pos:]
              else:
                text += '\n' + block
            text = re.sub(r'\n{3,}', '\n\n', text).strip() + '\n'
            rp.write_text(text, encoding='utf-8')

          packages = [
            ('guides/architecture-engineering/zero-trust/Zero_Trust_Program_Bilingual_v1.0/README.md',
             ['Espanol','Español','Spanish','es-419'],
             'guides/architecture-engineering/zero-trust/Zero_Trust_Program_Bilingual_v1.0',
             (), 'Español'),
            ('guides/career/cybersecurity-interview/Cybersecurity_Interview_Bilingual_v1.0/README.md',
             ['Espanol','Español','Spanish','es-419'],
             'guides/career/cybersecurity-interview/Cybersecurity_Interview_Bilingual_v1.0',
             (), 'Español'),
          ]
          for readme, langs, package, keywords, label in packages:
            files = actual_files(package, langs, keywords)
            replace_language_links(readme, langs, files, label)

          portfolio_readme = Path('guides/career/cybersecurity-portfolio/Cybersecurity_Portfolio_GitHub_Bilingual_v1.0/README.md')
          package = portfolio_readme.parent
          text = portfolio_readme.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^.*\]\(\./(?:English|Ingles|Inglês)/[^)]+\)\s*$', '', text)
          text = re.sub(r'(?m)^.*\]\(\./(?:Espanol|Español|Spanish|es-419)/[^)]+\)\s*$', '', text)
          eng = actual_files(package, ['English','Ingles','Inglês'], ('Portfolio',)) or actual_files(package, ['English','Ingles','Inglês'])
          spa = actual_files(package, ['Espanol','Español','Spanish','es-419'], ('Portafolio',)) or actual_files(package, ['Espanol','Español','Spanish','es-419'])
          links = []
          for label, files in [('English', eng), ('Español', spa)]:
            for f in files:
              rel = f.relative_to(package).as_posix()
              links.append(f'- [{label} — {f.suffix.upper().lstrip(".")}](./{rel})')
          pos = text.find('##')
          block = '\n'.join(links) + '\n\n'
          text = (text[:pos] + block + text[pos:]) if pos >= 0 else text + '\n' + block
          portfolio_readme.write_text(re.sub(r'\n{3,}', '\n\n', text).strip() + '\n', encoding='utf-8')

          Path('.github/workflows/temporary-fix-readme-associated-files.yml').unlink()
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair README navigation and associated-file links"
          git push origin agent/fix-readme-associated-files
